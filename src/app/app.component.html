<mat-sidenav-container class="app-shell">
  <mat-sidenav #sidenav mode="over" position="end">
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="sidenav.close()">Home</a>
      <a mat-list-item routerLink="/about" routerLinkActive="active" (click)="sidenav.close()">About</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      <a routerLink="/" class="app-brand">{{ title }}</a>

      @if (!isHandset()) {
        <nav class="toolbar-nav">
          <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
          <a mat-button routerLink="/about" routerLinkActive="active">About</a>
        </nav>
      }

      <span class="toolbar-spacer"></span>

      <app-theme-switcher></app-theme-switcher>

      @if (isHandset()) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
      }
    </mat-toolbar>

    <div class="main-container">
      <router-outlet></router-outlet>
    </div>

    <!-- If you don't need this ribbon, you can also uninstall the github-fork-ribbon-css npm package -->
    <!-- The color for this ribbon is overridden in styles.scss -->
    @if (!isHandset()) {
      <a class="github-fork-ribbon right-top" href="https://github.com/kbarnes3/base-angular-app" data-ribbon="Fork me on GitHub" title="Fork me on GitHub">Fork me on GitHub</a>
    }

    <footer class="footer" role="contentinfo">
      <div class="footer-inner">
        <p>&copy; 2020-2026 BaseAngularAppAuthors </p>
        <p>Built from version {{ gitVersion }}</p>
      </div>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
